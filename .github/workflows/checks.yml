name: Candidate checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-build.txt
      - run: python -m unittest discover -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright-core@1.64.1
      - name: Isolated synthetic browser checks
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList 'tools/serve_test_dashboard.py' -WindowStyle Hidden -PassThru
          try {
            $env:ANNO_BROWSER = 'C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe'
            Start-Sleep -Seconds 2
            New-Item -ItemType Directory -Path build -Force | Out-Null
            node tools/check_release_browser.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Browser verification failed' }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
